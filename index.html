<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2ea44f;
            --border-color: #333;
        }
        body.night-mode {
            --bg-color: #050000;
            --panel-bg: #1a0000;
            --text-color: #ff4444;
            --accent-color: #990000;
            --border-color: #500000;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        #map {
            height: calc(100vh - 200px);
            width: 100%;
        }
        /* Filtre pour assombrir la carte en mode nuit */
        body.night-mode .leaflet-tile-pane {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg);
        }
        #panel {
            height: 200px;
            background: var(--panel-bg);
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-top: 2px solid var(--border-color);
        }
        .btn-ctrl {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .search-box {
            display: flex;
            gap: 5px;
        }
        .search-box input {
            flex: 1;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
        }
        #status {
            font-size: 12px;
        }
        .btn-action {
            background: #0366d6;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body id="body-main">

    <div id="map"></div>

    <div id="panel">
        <div id="status">📍 Initialisation du GPS...</div>
        
        <!-- Moteur de recherche MGRS -->
        <div class="search-box">
            <input type="text" id="mgrsSearchInput" placeholder="Rechercher MGRS (ex: 30UXT...)">
            <button class="btn-ctrl" onclick="rechercherMGRS()">Chercher</button>
        </div>

        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
            <button class="btn-ctrl" onclick="centrerSurGPS()">Centrer GPS</button>
            <button class="btn-ctrl" onclick="basculerModeNuit()" style="background: #444;">🌙 Mode Nuit</button>
            <button class="btn-ctrl" onclick="effacerPoints()" style="background: #d73a49;">Effacer Tracé</button>
        </div>

        <div style="font-size: 11px; opacity: 0.8;">
            💡 <i>Cliquez sur la carte pour poser un jalon, calculer la distance et voir ses coordonnées MGRS.</i>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MGRS JS -->
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>

    <script>
        let map = null;
        let userMarker = null;
        let circle = null;
        let searchMarker = null;
        let cheminementPoints = [];
        let polylineRoute = null;
        let isNightMode = false;

        async function getAltitude(lat, lng) {
            try {
                const response = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lng}`);
                const data = await response.json();
                if (data && data.results && data.results.length > 0) return data.results[0].elevation;
            } catch (e) {}
            return 0;
        }

        function initialiserCarte() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                let mgrsCoord = "Hors zone MGRS";
                try {
                    mgrsCoord = mgrs.forward([lng, lat], 5);
                } catch (e) {
                    mgrsCoord = `Lat:${lat.toFixed(4)} Lon:${lng.toFixed(4)}`;
                }

                if (!map) {
                    const plan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    });

                    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 19,
                        attribution: '© Esri'
                    });

                    map = L.map('map', {
                        layers: [plan]
                    }).setView([lat, lng], 17);

                    const baseMaps = {
                        "Plan": plan,
                        "Satellite": satellite
                    };
                    L.control.layers(baseMaps).addTo(map);

                    // Clic sur la carte pour poser un point et mesurer
                    map.on('click', async function(e) {
                        const clickLat = e.latlng.lat;
                        const clickLng = e.latlng.lng;
                        let clickMgrs = "";
                        try {
                            clickMgrs = mgrs.forward([clickLng, clickLat], 5);
                        } catch (err) {
                            clickMgrs = "Coordonnée complexe";
                        }

                        document.getElementById('status').innerHTML = `⏳ <i>Calcul altitude point...</i>`;
                        const alt = await getAltitude(clickLat, clickLng);
                        
                        const marker = L.marker([clickLat, clickLng]).addTo(map);
                        marker.bindPopup(`<b>Jalon Posé</b><br>MGRS: ${clickMgrs}<br>Alt: ${alt}m`).openPopup();
                        
                        cheminementPoints.push({ lat: clickLat, lng: clickLng, marker: marker });
                        mettreAJourItineraire();

                        document.getElementById('status').innerHTML = `📍 <b>Point Ajouté</b><br><span style="font-size:11px;">${clickMgrs}</span>`;
                    });
                }

                if (userMarker) {
                    map.removeLayer(userMarker);
                    map.removeLayer(circle);
                }

                userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Votre Position</b><br>MGRS: ${mgrsCoord}`).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: '#0f0', fillColor: '#0f0', fillOpacity: 0.15 }).addTo(map);

                document.getElementById('status').innerHTML = `📍 <b>GPS OK</b> (Précision: ~${Math.round(accuracy)}m)<br><span style="font-size:11px;">${mgrsCoord}</span>`;

            }, error => {
                document.getElementById('status').innerHTML = `⚠️ <b>Erreur GPS</b> : Vérifiez les permissions.`;
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        function mettreAJourItineraire() {
            const latLngs = cheminementPoints.map(p => [p.lat, p.lng]);
            if (polylineRoute) map.removeLayer(polylineRoute);
            if (latLngs.length > 1) {
                polylineRoute = L.polyline(latLngs, { color: 'blue', weight: 4 }).addTo(map);
            }
        }

        function effacerPoints() {
            cheminementPoints.forEach(p => map.removeLayer(p.marker));
            cheminementPoints = [];
            if (polylineRoute) map.removeLayer(polylineRoute);
            document.getElementById('status').innerHTML = `🗑️ Tracé effacé.`;
        }

        function centrerSurGPS() {
            navigator.geolocation.getCurrentPosition(position => {
                map.setView([position.coords.latitude, position.coords.longitude], 17);
            });
        }

        function rechercherMGRS() {
            const val = document.getElementById('mgrsSearchInput').value.trim();
            if (!val) return;
            try {
                const latLon = mgrs.inverse(val);
                if (searchMarker) map.removeLayer(searchMarker);
                searchMarker = L.marker([latLon[1], latLon[0]]).addTo(map);
                map.setView([latLon[1], latLon[0]], 17);
                searchMarker.bindPopup(`<b>Recherche MGRS</b><br>${val.toUpperCase()}`).openPopup();
                document.getElementById('status').innerHTML = `🔍 <b>Trouvé :</b> ${val.toUpperCase()}`;
            } catch (err) {
                alert("Code MGRS invalide ou format incorrect !");
            }
        }

        function basculerModeNuit() {
            isNightMode = !isNightMode;
            document.getElementById('body-main').classList.toggle('night-mode', isNightMode);
        }

        window.onload = function() {
            initialiserCarte();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js');
            }
        };
    </script>
</body>
</html>
