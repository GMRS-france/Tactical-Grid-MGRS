<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MGRS Library -->
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        #status-container { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.85); color: #0f0; padding: 15px; border-radius: 8px; border: 1px solid #0f0; max-width: 90%; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #btn-pos { position: absolute; bottom: 30px; right: 20px; z-index: 1000; width: 65px; height: 65px; background: #0f0; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .btn-copy { background: #0f0; color: #000; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="status-container"><div id="status">Acquisition GPS...</div></div>
    <div id="map"></div>
    <button id="btn-pos" onclick="lancerProcessusTactique()">🎯</button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let marker = null;
        let circle = null;
        let clickMarker = null;
        let line = null; // Ligne de visée
        let userPos = null;

        // Fonction pour calculer l'azimut (cap en degrés) entre deux points GPS
        function calculerAzimut(lat1, lon1, lat2, lon2) {
            const toRad = (deg) => (deg * Math.PI) / 180;
            const toDeg = (rad) => (rad * 180) / Math.PI;

            const dLon = toRad(lon2 - lon1);
            const phi1 = toRad(lat1);
            const phi2 = toRad(lat2);

            const y = Math.sin(dLon) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
            
            let brng = Math.atan2(y, x);
            brng = toDeg(brng);
            return Math.round((brng + 360) % 360);
        }

        function lancerProcessusTactique() {
            document.getElementById('status').innerText = "Recherche de la position GPS...";

            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée par votre appareil.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                userPos = [lat, lng];

                let mgrsCoord = "";
                try {
                    mgrsCoord = mgrs.forward([lng, lat], 5);
                } catch (e) {
                    mgrsCoord = `Lat: ${lat.toFixed(5)}, Lon: ${lng.toFixed(5)}`;
                }

                if (!map) {
                    map = L.map('map').setView([lat, lng], 17);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: 'Map data © OpenStreetMap'
                    }).addTo(map);

                    // Écouteur de clic pour analyser une cible avec distance et azimut
                    map.on('click', function(e) {
                        const clickLat = e.latlng.lat;
                        const clickLng = e.latlng.lng;
                        let clickMgrs = "";

                        try {
                            clickMgrs = mgrs.forward([clickLng, clickLat], 5);
                        } catch (err) {
                            clickMgrs = `Lat: ${clickLat.toFixed(5)}, Lon: ${clickLng.toFixed(5)}`;
                        }

                        if (clickMarker) map.removeLayer(clickMarker);
                        if (line) map.removeLayer(line);

                        let tacticalInfo = "";
                        if (userPos) {
                            // Calcul de la distance
                            const distanceMeters = map.distance(userPos, [clickLat, clickLng]);
                            let distanceStr = distanceMeters >= 1000 ? 
                                `${(distanceMeters / 1000).toFixed(2)} km` : 
                                `${Math.round(distanceMeters)} m`;

                            // Calcul de l'azimut (cap)
                            const azimut = calculerAzimut(userPos[0], userPos[1], clickLat, clickLng);

                            tacticalInfo = `<br><b>Distance :</b> ${distanceStr}<br><b>Cap (Azimut) :</b> ${azimut}°`;

                            // Tracé d'une ligne jaune entre l'utilisateur et la cible
                            line = L.polyline([userPos, [clickLat, clickLng]], {
                                color: '#ff0',
                                weight: 3,
                                dashArray: '5, 5'
                            }).addTo(map);
                        }

                        clickMarker = L.marker([clickLat, clickLng]).addTo(map)
                            .bindPopup(`<b>Cible</b><br>${clickMgrs}${tacticalInfo}<br><button class="btn-copy" onclick="copierTexte('${clickMgrs}')">Copier MGRS</button>`)
                            .openPopup();

                        document.getElementById('status').innerHTML = `🎯 <b>Cible : ${clickMgrs}</b>${tacticalInfo}`;
                    });

                } else {
                    map.setView([lat, lng], 17);
                }

                if (marker) {
                    map.removeLayer(marker);
                    map.removeLayer(circle);
                }

                marker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Position Tactique</b><br>MGRS: ${mgrsCoord}<br><button class="btn-copy" onclick="copierTexte('${mgrsCoord}')">Copier MGRS</button>`).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: '#0f0', fillColor: '#0f0', fillOpacity: 0.2 }).addTo(map);

                document.getElementById('status').innerHTML = `📍 <b>${mgrsCoord}</b><br><span style="color:#ccc; font-size:12px;">Précision GPS : ±${Math.round(accuracy)}m</span>`;

            }, error => {
                document.getElementById('status').innerHTML = `<span style="color:#ff5555;">Erreur GPS : Activez la localisation.</span>`;
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }

        function copierTexte(texte) {
            navigator.clipboard.writeText(texte).then(() => {
                alert("Coordonnées copiées : " + texte);
            }).catch(() => {
                alert("Erreur lors de la copie");
            });
        }

        window.onload = function() {
            lancerProcessusTactique();
        };
    </script>
</body>
</html>
