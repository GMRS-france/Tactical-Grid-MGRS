<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        #status-container { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.85); color: #0f0; padding: 15px; border-radius: 8px; border: 1px solid #0f0; max-width: 90%; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #btn-pos { position: absolute; bottom: 30px; right: 20px; z-index: 1000; width: 65px; height: 65px; background: #0f0; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="status-container"><div id="status">Cliquez sur la carte pour obtenir un MGRS</div></div>
    <div id="map"></div>
    <button id="btn-pos" onclick="recenter()">🎯</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([48.5, -4.5], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let userMarker, clickMarker;

        // Fonction pour gérer le clic sur la carte
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            const mgrsCoord = mgrs.forward([lng, lat], 5);

            if (clickMarker) map.removeLayer(clickMarker);
            clickMarker = L.marker([lat, lng], {icon: L.divIcon({className: 'custom-icon', html: '📍'})}).addTo(map);
            clickMarker.bindPopup("<b>Point ciblé</b><br>MGRS: " + mgrsCoord).openPopup();
            
            document.getElementById('status').innerHTML = `📍 <b>Cible: ${mgrsCoord}</b><br><span style="font-size:12px;color:#ccc;">Lat: ${lat.toFixed(4)}, Lon: ${lng.toFixed(4)}</span>`;
        });

        function recenter() {
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude } = pos.coords;
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("Vous êtes ici").openPopup();
                map.setView([latitude, longitude], 17);
            });
        }

        window.onload = recenter;
    </script>
</body>
</html>
