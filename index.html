<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2ea44f;
            --border-color: #333;
        }
        body.night-mode {
            --bg-color: #050000;
            --panel-bg: #1a0000;
            --text-color: #ff4444;
            --accent-color: #990000;
            --border-color: #500000;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        #map {
            height: calc(100vh - 180px);
            width: 100%;
        }
        #panel {
            height: 180px;
            background: var(--panel-bg);
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-top: 2px solid var(--border-color);
        }
        .btn-ctrl {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-box {
            display: flex;
            gap: 5px;
        }
        .search-box input {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
        }
        #status {
            font-size: 13px;
        }
        #cours-section {
            font-size: 11px;
            max-height: 40px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            padding: 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body id="body-main">

    <div id="map"></div>

    <div id="panel">
        <div id="status">📍 Initialisation du GPS...</div>
        
        <!-- Moteur de recherche MGRS -->
        <div class="search-box">
            <input type="text" id="mgrsSearchInput" placeholder="Rechercher MGRS (ex: 30UXT...)">
            <button class="btn-ctrl" onclick="rechercherMGRS()">Chercher</button>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn-ctrl" onclick="centrerSurGPS()">Centrer GPS</button>
            <button class="btn-ctrl" onclick="basculerModeNuit()" style="background: #444;">🌙 Nuit</button>
        </div>

        <!-- Aide / Cours MGRS & Millièmes -->
        <div id="cours-section">
            <b>Aide MGRS / Millièmes :</b> 1 millième (MIL) = angle sous-tendant 1m à 1km. Coordonnées MGRS lues de gauche à droite puis de bas en haut.
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MGRS JS -->
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>

    <script>
        let map = null;
        let userMarker = null;
        let circle = null;
        let searchMarker = null;
        let isNightMode = false;

        function initialiserCarte() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                let mgrsCoord = "Hors zone MGRS";
                try {
                    mgrsCoord = mgrs.forward([lng, lat], 5);
                } catch (e) {
                    mgrsCoord = `Lat:${lat.toFixed(4)} Lon:${lng.toFixed(4)}`;
                }

                if (!map) {
                    // Fonds de carte Plan & Satellite
                    const plan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    });

                    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 19,
                        attribution: '© Esri'
                    });

                    map = L.map('map', {
                        layers: [plan]
                    }).setView([lat, lng], 17);

                    const baseMaps = {
                        "Plan": plan,
                        "Satellite": satellite
                    };
                    L.control.layers(baseMaps).addTo(map);
                }

                if (userMarker) {
                    map.removeLayer(userMarker);
                    map.removeLayer(circle);
                }

                userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Votre Position</b><br>MGRS: ${mgrsCoord}`).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: isNightMode ? '#f00' : '#0f0', fillColor: isNightMode ? '#f00' : '#0f0', fillOpacity: 0.15 }).addTo(map);

                document.getElementById('status').innerHTML = `📍 <b>GPS OK</b> : <span style="font-size:11px;">${mgrsCoord}</span>`;

            }, error => {
                document.getElementById('status').innerHTML = `⚠️ <b>Erreur GPS</b> : Vérifiez les permissions.`;
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        function centrerSurGPS() {
            navigator.geolocation.getCurrentPosition(position => {
                map.setView([position.coords.latitude, position.coords.longitude], 17);
            });
        }

        function rechercherMGRS() {
            const val = document.getElementById('mgrsSearchInput').value.trim();
            if (!val) return;
            try {
                const latLon = mgrs.inverse(val);
                if (searchMarker) map.removeLayer(searchMarker);
                searchMarker = L.marker([latLon[1], latLon[0]]).addTo(map);
                map.setView([latLon[1], latLon[0]], 17);
                searchMarker.bindPopup(`<b>Recherche MGRS</b><br>${val.toUpperCase()}`).openPopup();
                document.getElementById('status').innerHTML = `🔍 <b>Trouvé :</b> ${val.toUpperCase()}`;
            } catch (err) {
                alert("Code MGRS invalide ou format incorrect !");
            }
        }

        function basculerModeNuit() {
            isNightMode = !isNightMode;
            document.getElementById('body-main').classList.toggle('night-mode', isNightMode);
        }

        window.onload = function() {
            initialiserCarte();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js');
            }
        };
    </script>
</body>
</html>
