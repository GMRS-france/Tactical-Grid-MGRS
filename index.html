<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MGRS Library -->
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; transition: filter 0.3s ease; }
        
        /* Panneau d'état fixé en haut à droite */
        #status-container { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.85); color: #0f0; padding: 10px 14px; border-radius: 8px; border: 1px solid #0f0; max-width: 280px; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); line-height: 1.4; }
        #search-container { margin-top: 8px; display: flex; gap: 5px; }
        #search-input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 5px; border-radius: 4px; font-size: 12px; width: 160px; outline: none; text-transform: uppercase; }
        #search-btn { background: #0f0; color: #000; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        
        /* Boutons flottants en bas à droite */
        #btn-pos { position: absolute; bottom: 30px; right: 20px; z-index: 1000; width: 60px; height: 60px; background: #0f0; color: #000; border-radius: 50%; border: none; font-size: 26px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        #btn-night { position: absolute; bottom: 100px; right: 20px; z-index: 1000; width: 45px; height: 45px; background: #0f0; color: #000; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        #btn-fav { position: absolute; bottom: 155px; right: 20px; z-index: 1000; width: 45px; height: 45px; background: #0f0; color: #000; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        
        /* Boutons d'action dans les popups */
        .btn-action { background: #0f0; color: #000; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 4px; font-size: 11px; display: inline-block; }
        .btn-save { background: #ff0; color: #000; }

        /* Panneau des favoris */
        #favorites-panel { position: absolute; top: 120px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.9); color: #0f0; padding: 10px; border-radius: 8px; border: 1px solid #0f0; width: 260px; max-height: 200px; overflow-y: auto; display: none; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .fav-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 4px 0; }
        .fav-item button { background: none; border: none; color: #f55; cursor: pointer; font-weight: bold; }

        /* --- MODE NUIT (INFRAROUGE) --- */
        body.night-mode { background-color: #000; }
        body.night-mode #status-container { background: rgba(20,0,0,0.95); color: #f00; border-color: #f00; }
        body.night-mode #search-input { background: #100; color: #f00; border-color: #f00; }
        body.night-mode #search-btn { background: #f00; color: #fff; }
        body.night-mode #btn-pos { background: #f00; color: #fff; }
        body.night-mode #btn-night { background: #f00; color: #fff; }
        body.night-mode #btn-fav { background: #f00; color: #fff; }
        body.night-mode #favorites-panel { background: rgba(20,0,0,0.95); color: #f00; border-color: #f00; }
        body.night-mode .btn-action { background: #f00; color: #fff; }
        body.night-mode .btn-save { background: #fa0; color: #000; }
        body.night-mode #map { filter: brightness(0.5) invert(1) contrast(3) hue-rotate(180deg); }
    </style>
</head>
<body>
    <div id="status-container">
        <div id="status">Acquisition GPS...</div>
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Ex: 30TWN123456">
            <button id="search-btn" onclick="rechercherMGRS()">Chercher</button>
        </div>
    </div>

    <div id="favorites-panel">
        <b>⭐ Points Sauvegardés</b>
        <div id="favorites-list">Aucun point</div>
    </div>
    
    <div id="map"></div>
    <button id="btn-fav" onclick="basculerPanneauFavoris()" title="Voir les favoris">⭐</button>
    <button id="btn-night" onclick="basculerModeNuit()" title="Mode nuit">🌙</button>
    <button id="btn-pos" onclick="centrerSurGPS()" title="Recentrer GPS">🎯</button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let userMarker = null;
        let circle = null;
        
        let pointA = null;
        let pointB = null;
        let markerA = null;
        let markerB = null;
        let lineAB = null;
        let searchMarker = null;
        let isNightMode = false;
        let favoris = JSON.parse(localStorage.getItem('tactical_favs') || '[]');

        function calculerAzimutMilliemes(lat1, lon1, lat2, lon2) {
            const toRad = (deg) => (deg * Math.PI) / 180;
            const toDeg = (rad) => (rad * 180) / Math.PI;

            const dLon = toRad(lon2 - lon1);
            const phi1 = toRad(lat1);
            const phi2 = toRad(lat2);

            const y = Math.sin(dLon) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
            
            let brng = Math.atan2(y, x);
            brng = toDeg(brng);
            let azimutDeg = (brng + 360) % 360;

            let azimutMil = Math.round((azimutDeg * 6400) / 360);
            if (azimutMil >= 6400) azimutMil = 0;
            
            return azimutMil;
        }

        function initialiserCarte() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                let mgrsCoord = "";
                try {
                    mgrsCoord = mgrs.forward([lng, lat], 5);
                } catch (e) {
                    mgrsCoord = `Lat: ${lat.toFixed(5)}, Lon: ${lng.toFixed(5)}`;
                }

                if (!map) {
                    map = L.map('map').setView([lat, lng], 17);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: 'Map data © OpenStreetMap'
                    }).addTo(map);

                    map.on('click', function(e) {
                        const clickLat = e.latlng.lat;
                        const clickLng = e.latlng.lng;
                        let clickMgrs = "";

                        try {
                            clickMgrs = mgrs.forward([clickLng, clickLat], 5);
                        } catch (err) {
                            clickMgrs = `Lat: ${clickLat.toFixed(5)}, Lon: ${clickLng.toFixed(5)}`;
                        }

                        // Échappement des coordonnées pour injection propre dans la fonction globale
                        const latStr = clickLat;
                        const lngStr = clickLng;
                        const mStr = clickMgrs;

                        const popupContent = `<b>Point Cliqué</b><br>MGRS: ${clickMgrs}<br>` +
                            `<button class="btn-action" onclick="copierTexte('${clickMgrs}')">Copier MGRS</button> ` +
                            `<button class="btn-action btn-save" onclick="sauvegarderPoint(${latStr}, ${lngStr}, '${mStr}')">⭐ Sauvegarder</button>`;

                        if (!pointA || (pointA && pointB)) {
                            if (markerA) map.removeLayer(markerA);
                            if (markerB) map.removeLayer(markerB);
                            if (lineAB) map.removeLayer(lineAB);
                            
                            pointB = null;
                            pointA = [clickLat, clickLng];

                            markerA = L.marker(pointA).addTo(map)
                                .bindPopup(popupContent)
                                .openPopup();

                            document.getElementById('status').innerHTML = `📍 <b>Point A :</b> ${clickMgrs}<br><span style="color:${isNightMode ? '#f55' : '#ff0'};">Cliquez pour poser Point B</span>`;
                        
                        } else {
                            pointB = [clickLat, clickLng];

                            markerB = L.marker(pointB).addTo(map)
                                .bindPopup(popupContent)
                                .openPopup();

                            const distanceMeters = map.distance(pointA, pointB);
                            let distanceStr = distanceMeters >= 1000 ? 
                                `${(distanceMeters / 1000).toFixed(2)} km` : 
                                `${Math.round(distanceMeters)} m`;

                            const azimutMil = calculerAzimutMilliemes(pointA[0], pointA[1], pointB[0], pointB[1]);

                            lineAB = L.polyline([pointA, pointB], {
                                color: isNightMode ? '#f00' : '#ff0',
                                weight: 3,
                                dashArray: '5, 5'
                            }).addTo(map);

                            const tacticalInfo = `<br><b>Distance A-B :</b> ${distanceStr}<br><b>Cap :</b> ${azimutMil} mil`;
                            
                            markerB.setPopupContent(`<b>Point B (Cible)</b><br>${clickMgrs}${tacticalInfo}<br>` +
                                `<button class="btn-action" onclick="copierTexte('${clickMgrs}')">Copier MGRS</button> ` +
                                `<button class="btn-action btn-save" onclick="sauvegarderPoint(${latStr}, ${lngStr}, '${mStr}')">⭐ Sauvegarder</button>`);
                            markerB.openPopup();

                            document.getElementById('status').innerHTML = `🎯 <b>A ➔ B :</b> ${distanceStr}<br><b>Cap :</b> ${azimutMil} mil`;
                        }
                    });
                }

                if (userMarker) {
                    map.removeLayer(userMarker);
                    map.removeLayer(circle);
                }

                userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Votre Position GPS</b><br>MGRS: ${mgrsCoord}`).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: isNightMode ? '#f00' : '#0f0', fillColor: isNightMode ? '#f00' : '#0f0', fillOpacity: 0.15 }).addTo(map);

                document.getElementById('status').innerHTML = `📍 <b>GPS OK</b><br><span style="font-size:11px;">${mgrsCoord}</span>`;

            }, error => {
                alert("Erreur GPS : Activez la localisation.");
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }

        function sauvegarderPoint(lat, lng, mgrsCode) {
            const nom = prompt("Nom de ce point (ex: Point de ralliement, Source...):", "Point " + (favoris.length + 1));
            if (!nom) return;

            const nouveauPoint = { nom, lat, lng, mgrs: mgrsCode };
            favoris.push(nouveauPoint);
            localStorage.setItem('tactical_favs', JSON.stringify(favoris));
            
            mettreAJourAffichageFavoris();
            alert("Point sauvegardé avec succès !");
        }

        function mettreAJourAffichageFavoris() {
            const listeDiv = document.getElementById('favorites-list');
            if (favoris.length === 0) {
                listeDiv.innerHTML = "Aucun point";
                return;
            }

            let html = "";
            favoris.forEach((pt, index) => {
                html += `<div class="fav-item">
                    <span style="cursor:pointer;" onclick="centrerSurPoint(${pt.lat}, ${pt.lng})"><b>${pt.nom}</b><br>${pt.mgrs}</span>
                    <button onclick="supprimerFavoris(${index})">❌</button>
                </div>`;
            });
            listeDiv.innerHTML = html;
        }

        function centrerSurPoint(lat, lng) {
            map.setView([lat, lng], 18);
        }

        function supprimerFavoris(index) {
            favoris.splice(index, 1);
            localStorage.setItem('tactical_favs', JSON.stringify(favoris));
            mettreAJourAffichageFavoris();
        }

        function basculerPanneauFavoris() {
            const panel = document.getElementById('favorites-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            mettreAJourAffichageFavoris();
        }

        function basculerModeNuit() {
            isNightMode = !isNightMode;
            document.body.classList.toggle('night-mode', isNightMode);
            const btnNight = document.getElementById('btn-night');
            btnNight.innerText = isNightMode ? "☀️" : "🌙";
        }

        function rechercherMGRS() {
            const inputVal = document.getElementById('search-input').value.trim();
            if (!inputVal) {
                alert("Veuillez entrer un code MGRS.");
                return;
            }

            try {
                const latLon = mgrs.inverse(inputVal);
                const lng = latLon[0];
                const lat = latLon[1];

                map.setView([lat, lng], 17);

                if (searchMarker) {
                    map.removeLayer(searchMarker);
                }

                const latStr = lat;
                const lngStr = lng;
                const mStr = inputVal.toUpperCase();

                searchMarker = L.marker([lat, lng]).addTo(map)
                    .bindPopup(`<b>Objectif Recherché</b><br>MGRS: ${mStr}<br>` +
                        `<button class="btn-action" onclick="copierTexte('${mStr}')">Copier MGRS</button> ` +
                        `<button class="btn-action btn-save" onclick="sauvegarderPoint(${latStr}, ${lngStr}, '${mStr}')">⭐ Sauvegarder</button>`)
                    .openPopup();

                document.getElementById('status').innerHTML = `🔍 <b>Trouvé :</b><br><span style="font-size:11px;">${mStr}</span>`;

            } catch (err) {
                alert("Code MGRS invalide ou mal formaté !");
            }
        }

        function centrerSurGPS() {
            navigator.geolocation.getCurrentPosition(pos => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 17);
            });
        }

        function copierTexte(texte) {
            navigator.clipboard.writeText(texte).then(() => {
                alert("Coordonnées copiées : " + texte);
            }).catch(() => {
                alert("Erreur lors de la copie");
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW err:', err));
            });
        }

        window.onload = function() {
            initialiserCarte();
            mettreAJourAffichageFavoris();
        };
    </script>
</body>
</html>
