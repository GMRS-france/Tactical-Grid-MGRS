<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
        #map {
            height: calc(100vh - 120px);
            width: 100%;
        }
        #panel {
            height: 120px;
            background: #1e1e1e;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-top: 2px solid #333;
        }
        .btn-ctrl {
            background: #2ea44f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-ctrl:active {
            background: #2c974b;
        }
        #status {
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="panel">
        <div id="status">📍 Initialisation du GPS...</div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-ctrl" onclick="centrerSurGPS()">Centrer GPS</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MGRS JS -->
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>

    <script>
        let map = null;
        let userMarker = null;
        let circle = null;
        let cheminementPoints = [];
        let isNightMode = false;

        async function getAltitude(lat, lng) {
            try {
                const response = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lng}`);
                const data = await response.json();
                if (data && data.results && data.results.length > 0) return data.results[0].elevation;
            } catch (e) {}
            return 0;
        }

        function initialiserCarte() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                let mgrsCoord = "Hors zone MGRS";
                try {
                    mgrsCoord = mgrs.forward([lng, lat], 5);
                } catch (e) {
                    mgrsCoord = `Lat:${lat.toFixed(4)} Lon:${lng.toFixed(4)}`;
                }

                if (!map) {
                    // Fonds de carte
                    const plan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    });

                    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 19,
                        attribution: '© Esri'
                    });

                    const ign = L.tileLayer('https://wxs.ign.fr/choisirgeoportail/geoportail/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
                        maxZoom: 19,
                        attribution: '© IGN'
                    });

                    // Initialisation de la carte avec le Plan par défaut
                    map = L.map('map', {
                        layers: [plan]
                    }).setView([lat, lng], 17);

                    // Bouton de sélection des couches (Plan / Satellite / IGN)
                    const baseMaps = {
                        "Plan": plan,
                        "Satellite": satellite,
                        "IGN": ign
                    };
                    L.control.layers(baseMaps).addTo(map);

                    map.on('click', async function(e) {
                        const clickLat = e.latlng.lat;
                        const clickLng = e.latlng.lng;
                        let clickMgrs = "";
                        try {
                            clickMgrs = mgrs.forward([clickLng, clickLat], 5);
                        } catch (err) {
                            clickMgrs = "Coordonnée complexe";
                        }

                        document.getElementById('status').innerHTML = `⏳ <i>Calcul altitude...</i>`;
                        const alt = await getAltitude(clickLat, clickLng);
                        const marker = L.marker([clickLat, clickLng]).addTo(map);
                        cheminementPoints.push({ lat: clickLat, lng: clickLng, alt: alt, mgrs: clickMgrs, marker: marker });
                        
                        document.getElementById('status').innerHTML = `📍 <b>Point ajouté</b><br><span style="font-size:11px;">${clickMgrs}</span>`;
                    });
                }

                if (userMarker) {
                    map.removeLayer(userMarker);
                    map.removeLayer(circle);
                }

                userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Votre Position</b><br>MGRS: ${mgrsCoord}`).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: '#0f0', fillColor: '#0f0', fillOpacity: 0.15 }).addTo(map);

                document.getElementById('status').innerHTML = `📍 <b>GPS OK</b><br><span style="font-size:11px;">${mgrsCoord}</span>`;

            }, error => {
                document.getElementById('status').innerHTML = `⚠️ <b>Erreur GPS</b><br><span style="font-size:11px;">Vérifiez les permissions</span>`;
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        function centrerSurGPS() {
            navigator.geolocation.getCurrentPosition(position => {
                map.setView([position.coords.latitude, position.coords.longitude], 17);
            });
        }

        window.onload = function() {
            initialiserCarte();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js');
            }
        };
    </script>
</body>
</html>
