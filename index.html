<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS</title>
    <!-- Lien vers ton icône personnalisée -->
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Librairie de conversion MGRS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mgrs/1.0.0/mgrs.min.js"></script>
    
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* Style du bandeau de statut en haut */
        #status-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(20, 20, 20, 0.85);
            color: #00ff66;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #00ff66;
            text-align: center;
            max-width: 90%;
        }
        /* Bouton "Ma position" en bas à droite */
        #btn-pos {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #btn-pos:active {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <div id="status-container">
        <div id="status">GPS en attente de précision...</div>
    </div>

    <div id="map"></div>

    <button id="btn-pos" onclick="maPosition()">
        🎯 Ma position
    </button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialisation de la carte (centrée sur ta zone par défaut)
        const map = L.map('map').setView([48.442, -4.534], 14);

        // Ajout du fond de plan OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;
        let circle = null;

        // Fonction exécutée quand le GPS réussit à trouver la position
        function onPositionSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy; // Précision en mètres

            // Conversion en MGRS
            let mgrsCoord = "Calcul MGRS...";
            try {
                if (typeof mgrs !== 'undefined') {
                    // mgrs.forward convertit [longitude, latitude] en MGRS
                    mgrsCoord = mgrs.forward([lng, lat], 5);
                }
            } catch (e) {
                console.error("Erreur MGRS :", e);
            }

            // Supprimer l'ancien marqueur pour le replacer au bon endroit
            if (marker) {
                map.removeLayer(marker);
                map.removeLayer(circle);
            }

            // Ajouter le marqueur précis sur la carte
            marker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`<b>Position Actuelle</b><br>MGRS : <b>${mgrsCoord}</b><br>Précision : ±${Math.round(accuracy)}m`)
                .openPopup();

            // Ajouter le cercle de précision autour du point
            circle = L.circle([lat, lng], {
                radius: accuracy,
                color: '#3388ff',
                fillColor: '#3388ff',
                fillOpacity: 0.2
            }).addTo(map);

            // Centrer et zoomer la carte sur la position exacte
            map.setView([lat, lng], 17);

            // Mettre à jour le texte du bandeau en haut
            document.getElementById('status').innerHTML = `📍 MGRS : ${mgrsCoord} <br><span style="font-size:11px; color:#ccc;">Précision : ±${Math.round(accuracy)}m</span>`;
        }

        // En cas d'erreur de géolocalisation
        function onPositionError(error) {
            let msg = "Erreur GPS : ";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    msg += "Accès refusé par l'utilisateur.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    msg += "Signal GPS indisponible.";
                    break;
                case error.TIMEOUT:
                    msg += "Délai d'attente dépassé.";
                    break;
                default:
                    msg += error.message;
            }
            document.getElementById('status').innerText = msg;
        }

        // Fonction principale déclenchée au clic sur le bouton
        function maPosition() {
            document.getElementById('status').innerText = "Recherche du signal haute précision...";
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
                return;
            }

            // Demande au navigateur une position ultra-précise
            navigator.geolocation.getCurrentPosition(onPositionSuccess, onPositionError, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            });
        }

        // Lancer la géolocalisation automatiquement à l'ouverture de la page
        window.onload = function() {
            maPosition();
        };
    </script>
</body>
</html>
