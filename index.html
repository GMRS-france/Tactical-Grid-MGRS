<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    <link rel="icon" type="image/png" href="icon.png">
    <!-- Leaflet et MGRS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mgrs/1.0.0/mgrs.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        #status-container { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); color: #0f0; padding: 10px; border-radius: 5px; border: 1px solid #0f0; }
        #btn-pos { position: absolute; bottom: 30px; right: 20px; z-index: 1000; padding: 15px; background: #0f0; border-radius: 50%; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="status-container"><div id="status">Chargement...</div></div>
    <div id="map"></div>
    <button id="btn-pos" onclick="maPosition()">🎯</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([46.5, 2.5], 6); // Vue centrée sur la France
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: 'Map data © OpenStreetMap'
        }).addTo(map);

        // Service Worker pour le mode Hors-Ligne
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('Mode Hors-Ligne activé'));
        }

        let marker, circle;
        function onPositionSuccess(position) {
            const { latitude: lat, longitude: lng, accuracy } = position.coords;
            const mgrsCoord = mgrs.forward([lng, lat], 5);
            
            if (marker) { map.removeLayer(marker); map.removeLayer(circle); }
            marker = L.marker([lat, lng]).addTo(map).bindPopup("MGRS: " + mgrsCoord).openPopup();
            circle = L.circle([lat, lng], { radius: accuracy }).addTo(map);
            map.setView([lat, lng], 16);
            document.getElementById('status').innerHTML = `📍 ${mgrsCoord}<br>Précision: ${Math.round(accuracy)}m`;
        }
        function maPosition() { navigator.geolocation.getCurrentPosition(onPositionSuccess, () => alert("GPS requis"), {enableHighAccuracy: true}); }
        window.onload = maPosition;
    </script>
</body>
</html>
