<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    <!-- Leaflet et MGRS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mgrs/1.0.0/mgrs.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        #status-container { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.85); color: #0f0; padding: 10px 15px; border-radius: 5px; border: 1px solid #0f0; max-width: 90%; font-size: 14px; }
        #btn-pos { position: absolute; bottom: 30px; right: 20px; z-index: 1000; width: 60px; height: 60px; background: #0f0; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    </style>
</head>
<body>
    <div id="status-container"><div id="status">Initialisation du GPS...</div></div>
    <div id="map"></div>
    <button id="btn-pos" onclick="maPosition()">🎯</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([46.5, 2.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: 'Map data © OpenStreetMap'
        }).addTo(map);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('Service Worker OK'));
        }

        let marker, circle;

        function onPositionSuccess(position) {
            const { latitude: lat, longitude: lng, accuracy } = position.coords;
            let mgrsCoord = "Erreur MGRS";
            try {
                mgrsCoord = mgrs.forward([lng, lat], 5);
            } catch (e) {
                console.error(e);
            }
            
            if (marker) { map.removeLayer(marker); map.removeLayer(circle); }
            marker = L.marker([lat, lng]).addTo(map).bindPopup("MGRS: " + mgrsCoord).openPopup();
            circle = L.circle([lat, lng], { radius: accuracy, color: '#3388ff', fillColor: '#3388ff', fillOpacity: 0.2 }).addTo(map);
            map.setView([lat, lng], 16);
            
            document.getElementById('status').innerHTML = `📍 <b>${mgrsCoord}</b><br><span style="font-size:12px;color:#ccc;">Précision : ±${Math.round(accuracy)}m</span>`;
        }

        function onPositionError(error) {
            let msg = "Erreur GPS : ";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    msg += "Permission refusée. Autorisez la géolocalisation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    msg += "Position indisponible.";
                    break;
                case error.TIMEOUT:
                    msg += "Délai de recherche dépassé.";
                    break;
                default:
                    msg += error.message;
            }
            document.getElementById('status').innerHTML = `<span style="color:#ff5555;">${msg}</span>`;
        }

        function maPosition() {
            document.getElementById('status').innerText = "Recherche de la position...";
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }
            navigator.geolocation.getCurrentPosition(onPositionSuccess, onPositionError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }

        window.onload = function() {
            maPosition();
        };
    </script>
</body>
</html>
