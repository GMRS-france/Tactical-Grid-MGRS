<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2ea44f;
            --border-color: #333;
        }
        body.night-mode {
            --bg-color: #0d0000;
            --panel-bg: #1a0303;
            --text-color: #ff3333;
            --accent-color: #8b0000;
            --border-color: #400000;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        #map {
            height: calc(100vh - 210px);
            width: 100%;
            position: relative;
        }
        #map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 210px);
            background-color: rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        body.night-mode #map-overlay {
            display: block;
        }
        #panel {
            height: 210px;
            background: var(--panel-bg);
            padding: 8px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-top: 2px solid var(--border-color);
            overflow-y: auto;
        }
        .btn-ctrl {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }
        .search-box {
            display: flex;
            gap: 5px;
        }
        .search-box input {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            font-size: 12px;
        }
        #status {
            font-size: 11px;
        }
        .btn-action {
            background: #0366d6;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 4px;
            font-size: 11px;
        }
    </style>
</head>
<body id="body-main">

    <div id="map"></div>
    <div id="map-overlay"></div>

    <div id="panel">
        <div id="status">📍 Initialisation du GPS...</div>
        
        <div class="search-box">
            <input type="text" id="mgrsSearchInput" placeholder="Rechercher MGRS (ex: 30UXT...)">
            <button class="btn-ctrl" onclick="rechercherMGRS()">Chercher</button>
        </div>

        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
            <button class="btn-ctrl" onclick="centrerSurGPS()">Centrer GPS</button>
            <button class="btn-ctrl" onclick="basculerModeNuit()" style="background: #444;">🌙 Mode Nuit</button>
            <button class="btn-ctrl" onclick="effacerPoints()" style="background: #d73a49;">Effacer Tracé</button>
            <button class="btn-ctrl" onclick="voirFavoris()" style="background: #d29922;">⭐ Favoris (<span id="fav-count">0</span>)</button>
            <button class="btn-ctrl" onclick="exporterGeoJSON()" style="background: #0366d6;">💾 Exporter</button>
            <button class="btn-ctrl" onclick="document.getElementById('importFile').click()" style="background: #6f42c1;">📂 Importer</button>
            <input type="file" id="importFile" style="display: none;" accept=".geojson,.json" onchange="importerGeoJSON(event)">
        </div>

        <div style="font-size: 10px; opacity: 0.8;">
            💡 <i>Cliquez sur la carte pour poser des jalons, calculer les caps et partager vos positions.</i>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MGRS JS -->
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => { console.log('SW enregistré:', reg.scope); })
                    .catch((err) => { console.log('Échec SW:', err); });
            });
        }

        let map = null;
        let userMarker = null;
        let circle = null;
        let searchMarker = null;
        let cheminementPoints = [];
        let polylineRoute = null;
        let favorisMarkers = [];
        let cerclesZones = [];
        let isNightMode = false;
        let favoris = JSON.parse(localStorage.getItem('tactical_favs')) || [];

        function calculerCaps(lat1, lon1, lat2, lon2) {
            const toRad = (deg) => (deg * Math.PI) / 180;
            const toDeg = (rad) => (rad * 180) / Math.PI;
            const dLon = toRad(lon2 - lon1);
            const phi1 = toRad(lat1);
            const phi2 = toRad(lat2);
            const y = Math.sin(dLon) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
            let brng = toDeg(Math.atan2(y, x));
            let azimutDeg = Math.round((brng + 360) % 360);
            let azimutMil = Math.round((azimutDeg * 6400) / 360);
            if (azimutMil >= 6400) azimutMil = 0;
            return { deg: azimutDeg, mil: azimutMil };
        }

        function calculerDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        async function getAltitude(lat, lng) {
            try {
                const response = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lng}`);
                const data = await response.json();
                if (data && data.results && data.results.length > 0) return data.results[0].elevation;
            } catch (e) {}
            return 0;
        }

        function initialiserCarte() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                let mgrsCoord = "Hors zone MGRS";
                try { mgrsCoord = mgrs.forward([lng, lat], 5); } catch (e) { mgrsCoord = `Lat:${lat.toFixed(4)} Lon:${lng.toFixed(4)}`; }

                if (!map) {
                    const planOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OSM' });
                    const topoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap' });
                    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' });

                    map = L.map('map', { layers: [planOSM] }).setView([lat, lng], 17);
                    L.control.layers({ "Plan OSM": planOSM, "Topo (Courbes de niveau)": topoMap, "Satellite": satellite }).addTo(map);

                    map.on('click', async function(e) {
                        const clickLat = e.latlng.lat;
                        const clickLng = e.latlng.lng;
                        let clickMgrs = "";
                        try { clickMgrs = mgrs.forward([clickLng, clickLat], 5); } catch (err) { clickMgrs = "N/A"; }

                        document.getElementById('status').innerHTML = `⏳ <i>Calcul...</i>`;
                        const alt = await getAltitude(clickLat, clickLng);
                        
                        let infoSupp = "";
                        if (cheminementPoints.length > 0) {
                            const d = cheminementPoints[cheminementPoints.length - 1];
                            const dist = calculerDistance(d.lat, d.lng, clickLat, clickLng);
                            const cap = calculerCaps(d.lat, d.lng, clickLat, clickLng);
                            infoSupp = `<br>📏 Dist: ${dist}m<br>🎯 Cap: <b>${cap.mil} ‰</b> (${cap.deg}°)`;
                        }

                        const pointIndex = cheminementPoints.length + 1;
                        const marker = L.marker([clickLat, clickLng]).addTo(map);
                        
                        marker.bindPopup(`
                            <b>Jalon #${pointIndex}</b><br>
                            MGRS: ${clickMgrs}<br>
                            Alt: ${alt}m${infoSupp}<br>
                            <button class="btn-action" style="background:#2ea44f;" onclick="copierMGRS('${clickMgrs}')">📋 Copier MGRS</button><br>
                            <div style="margin-top:4px; border-top:1px solid #ccc; padding-top:4px;">
                                <input type="number" id="rayonInput_${pointIndex}" placeholder="Rayon (m)" value="500" style="width:70px; padding:2px;">
                                <button class="btn-action" onclick="ajouterCercleSurJalon(${clickLat}, ${clickLng}, ${pointIndex})">🎯 Zone</button>
                            </div>
                            <button class="btn-action" style="background:#d29922; margin-top:4px;" onclick="demanderNomFavori(${clickLat}, ${clickLng}, '${clickMgrs}')">⭐ Sauvegarder</button>
                        `).openPopup();
                        
                        cheminementPoints.push({ lat: clickLat, lng: clickLng, marker: marker, mgrs: clickMgrs });
                        mettreAJourItineraire();
                        document.getElementById('status').innerHTML = `📍 <b>Jalon #${pointIndex} Ajouté</b>`;
                    });
                }

                if (userMarker) { map.removeLayer(userMarker); map.removeLayer(circle); }
                userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Votre Position</b><br>MGRS: ${mgrsCoord}<br><button class="btn-action" style="background:#2ea44f;" onclick="copierMGRS('${mgrsCoord}')">📋 Copier MGRS</button>`).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: '#0f0', fillColor: '#0f0', fillOpacity: 0.15 }).addTo(map);
                document.getElementById('status').innerHTML = `📍 <b>GPS OK</b>`;
                afficherFavorisSurCarte();
                mettreAJourAffichageFavoris();
            }, error => { document.getElementById('status').innerHTML = `⚠️ <b>Erreur GPS</b>`; }, { enableHighAccuracy: true });
        }

        function copierMGRS(texteMGRS) {
            navigator.clipboard.writeText(texteMGRS).then(() => {
                document.getElementById('status').innerHTML = `📋 <b>Copié : ${texteMGRS}</b>`;
            }).catch(err => {
                alert("Erreur lors de la copie : " + texteMGRS);
            });
        }

        function ajouterCercleSurJalon(lat, lng, pointIndex) {
            const inputEl = document.getElementById(`rayonInput_${pointIndex}`);
            const rayon = inputEl ? parseInt(inputEl.value) || 500 : 500;
            
            const cercle = L.circle([lat, lng], {
                radius: rayon,
                color: '#ff7800',
                fillColor: '#ff7800',
                fillOpacity: 0.2,
                weight: 2
            }).addTo(map);

            cerclesZones.push(cercle);
            map.closePopup();
            document.getElementById('status').innerHTML = `🎯 <b>Zone de ${rayon}m ajoutée</b>`;
        }

        // --- AFFICHAGE MIS À JOUR DES FAVORIS (AVEC MGRS ET TÉLÉPORTATION) ---
        function afficherFavorisSurCarte() {
            favorisMarkers.forEach(m => map.removeLayer(m));
            favorisMarkers = [];
            favoris.forEach((f, index) => {
                const favMarker = L.marker([f.lat, f.lng], { title: f.nom }).addTo(map);
                
                // Popup complet avec le MGRS affiché, bouton de copie et bouton de suppression
                favMarker.bindPopup(`
                    <b>⭐ ${f.nom}</b><br>
                    MGRS: ${f.mgrs}<br>
                    <button class="btn-action" style="background:#2ea44f;" onclick="copierMGRS('${f.mgrs}')">📋 Copier MGRS</button><br>
                    <button class="btn-action" style="background:#d73a49; margin-top:4px;" onclick="supprimerFavori(${index})">🗑️ Supprimer</button>
                `);

                // Clic direct sur le marqueur favori sur la carte -> Téléportation / centrage
                favMarker.on('click', function() {
                    map.setView([f.lat, f.lng], 17);
                    document.getElementById('status').innerHTML = `🎯 <b>Téléporté sur : ${f.nom}</b>`;
                });

                favorisMarkers.push(favMarker);
            });
        }

        function mettreAJourItineraire() {
            const latLngs = cheminementPoints.map(p => [p.lat, p.lng]);
            if (polylineRoute) map.removeLayer(polylineRoute);
            if (latLngs.length > 1) polylineRoute = L.polyline(latLngs, { color: '#0055ff', weight: 4 }).addTo(map);
        }

        function effacerPoints() {
            cheminementPoints.forEach(p => map.removeLayer(p.marker));
            cheminementPoints = [];
            if (polylineRoute) map.removeLayer(polylineRoute);
            
            cerclesZones.forEach(c => map.removeLayer(c));
            cerclesZones = [];

            document.getElementById('status').innerHTML = `🗑️ Tracé et zones effacés.`;
        }

        function demanderNomFavori(lat, lng, mgrsText) {
            const nomPerso = prompt("Nom du favori :", `Point ${favoris.length + 1}`);
            if (nomPerso !== null) sauvegarderFavori(lat, lng, mgrsText, nomPerso.trim());
        }

        function sauvegarderFavori(lat, lng, mgrsText, nom) {
            favoris.push({ lat, lng, mgrs: mgrsText, nom: nom, date: new Date().toLocaleDateString() });
            localStorage.setItem('tactical_favs', JSON.stringify(favoris));
            afficherFavorisSurCarte();
            mettreAJourAffichageFavoris();
            map.closePopup();
            document.getElementById('status').innerHTML = `⭐ <b>Favori "${nom}" sauvegardé</b>`;
        }

        function supprimerFavori(index) {
            favoris.splice(index, 1);
            localStorage.setItem('tactical_favs', JSON.stringify(favoris));
            afficherFavorisSurCarte();
            mettreAJourAffichageFavoris();
            map.closePopup();
            document.getElementById('status').innerHTML = `🗑️ <b>Favori supprimé</b>`;
        }

        function mettreAJourAffichageFavoris() { document.getElementById('fav-count').innerText = favoris.length; }

        // --- MENU DE SÉLECTION RAPIDE DES FAVORIS (TÉLÉPORTATION) ---
        function voirFavoris() {
            if (favoris.length === 0) return alert("Aucun favori enregistré.");
            let t = "Liste des Favoris :\n";
            favoris.forEach((f, i) => t += `${i + 1}. ${f.nom} (${f.mgrs})\n`);
            const choix = prompt(t + "\nEntrez le numéro du favori pour vous y téléporter :");
            if (choix) {
                const index = parseInt(choix) - 1;
                if (favoris[index] && favorisMarkers[index]) {
                    // Téléportation de la caméra sur le favori choisi
                    map.setView([favoris[index].lat, favoris[index].lng], 17);
                    favorisMarkers[index].openPopup();
                    document.getElementById('status').innerHTML = `🎯 <b>Téléporté sur : ${favoris[index].nom}</b>`;
                } else {
                    alert("Numéro invalide.");
                }
            }
        }

        function exporterGeoJSON() {
            let features = [];
            cheminementPoints.forEach((p, index) => {
                features.push({
                    type: "Feature",
                    geometry: { type: "Point", coordinates: [p.lng, p.lat] },
                    properties: { type: "Jalon", name: `Jalon #${index + 1}`, mgrs: p.mgrs }
                });
            });
            if (cheminementPoints.length > 1) {
                features.push({
                    type: "Feature",
                    geometry: { type: "LineString", coordinates: cheminementPoints.map(p => [p.lng, p.lat]) },
                    properties: { type: "Itineraire", name: "Tracé tactique" }
                });
            }
            favoris.forEach(f => {
                features.push({
                    type: "Feature",
                    geometry: { type: "Point", coordinates: [f.lng, f.lat] },
                    properties: { type: "Favori", name: f.nom, mgrs: f.mgrs }
                });
            });

            const geojsonCollection = { type: "FeatureCollection", features: features };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(geojsonCollection, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "tactical_export.geojson");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            document.getElementById('status').innerHTML = `💾 <b>Export réussi (.geojson)</b>`;
        }

        function importerGeoJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const geojson = JSON.parse(e.target.result);
                    let importedCount = 0;
                    if (geojson.features) {
                        geojson.features.forEach(feat => {
                            if (feat.geometry && feat.geometry.type === "Point") {
                                const coords = feat.geometry.coordinates;
                                const props = feat.properties || {};
                                const nom = props.name || "Point importé";
                                const mgrsText = props.mgrs || "";
                                favoris.push({ lat: coords[1], lng: coords[0], mgrs: mgrsText, nom: nom });
                                importedCount++;
                            }
                        });
                        localStorage.setItem('tactical_favs', JSON.stringify(favoris));
                        afficherFavorisSurCarte();
                        mettreAJourAffichageFavoris();
                        document.getElementById('status').innerHTML = `📂 <b>${importedCount} éléments importés !</b>`;
                    }
                } catch (err) { alert("Erreur lecture fichier."); }
                event.target.value = "";
            };
            reader.readAsText(file);
        }

        function centrerSurGPS() { navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 17)); }

        function rechercherMGRS() {
            const val = document.getElementById('mgrsSearchInput').value.trim();
            try {
                const latLon = mgrs.inverse(val);
                if (searchMarker) map.removeLayer(searchMarker);
                searchMarker = L.marker([latLon[1], latLon[0]]).addTo(map);
                map.setView([latLon[1], latLon[0]], 17);
            } catch (err) { alert("Format MGRS invalide !"); }
        }

        function basculerModeNuit() { isNightMode = !isNightMode; document.getElementById('body-main').classList.toggle('night-mode', isNightMode); }

        window.onload = function() { initialiserCarte(); };
    </script>
</body>
</html>
