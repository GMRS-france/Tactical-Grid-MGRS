<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mgrs/1.0.0/mgrs.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        #status-container { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.85); color: #0f0; padding: 15px; border-radius: 8px; border: 1px solid #0f0; max-width: 90%; font-size: 15px; }
        #btn-pos { position: absolute; bottom: 30px; right: 20px; z-index: 1000; width: 65px; height: 65px; background: #0f0; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="status-container"><div id="status">Démarrage...</div></div>
    <div id="map"></div>
    <button id="btn-pos" onclick="maPosition()">🎯</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([48.5, 2.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let marker, circle;

        function maPosition() {
            document.getElementById('status').innerText = "Recherche GPS...";
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude: lat, longitude: lng, accuracy } = pos.coords;
                let mgrsResult = "Calcul en cours...";
                
                try {
                    // La librairie attend [longitude, latitude]
                    mgrsResult = mgrs.forward([lng, lat], 5);
                } catch(e) {
                    mgrsResult = `Lat: ${lat.toFixed(6)}, Lon: ${lng.toFixed(6)}`;
                }

                if (marker) { map.removeLayer(marker); map.removeLayer(circle); }
                marker = L.marker([lat, lng]).addTo(map).bindPopup("MGRS: " + mgrsResult).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: '#0f0', fillOpacity: 0.2 }).addTo(map);
                map.setView([lat, lng], 17);
                document.getElementById('status').innerHTML = `📍 <b>${mgrsResult}</b><br><small>Précision: ±${Math.round(accuracy)}m</small>`;
            }, err => {
                document.getElementById('status').innerHTML = `<span style="color:red">Erreur GPS: ${err.message}</span>`;
            }, { enableHighAccuracy: true, timeout: 10000 });
        }
        window.onload = maPosition;
    </script>
</body>
</html>
