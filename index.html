<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2ea44f;
            --border-color: #333;
        }
        body.night-mode {
            --bg-color: #0d0000;
            --panel-bg: #1a0303;
            --text-color: #ff3333;
            --accent-color: #8b0000;
            --border-color: #400000;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        #map {
            height: calc(100vh - 210px);
            width: 100%;
            position: relative;
        }
        #map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 210px);
            background-color: rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        body.night-mode #map-overlay {
            display: block;
        }
        #panel {
            height: 210px;
            background: var(--panel-bg);
            padding: 8px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-top: 2px solid var(--border-color);
            overflow-y: auto;
        }
        .btn-ctrl {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }
        .search-box {
            display: flex;
            gap: 5px;
        }
        .search-box input {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            font-size: 12px;
        }
        #status {
            font-size: 11px;
        }
        .btn-action {
            background: #0366d6;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 4px;
            font-size: 11px;
        }
    </style>
</head>
<body id="body-main">

    <div id="map"></div>
    <div id="map-overlay"></div>

    <div id="panel">
        <div id="status">📍 Initialisation du GPS...</div>
        
        <div class="search-box">
            <input type="text" id="mgrsSearchInput" placeholder="Rechercher MGRS (ex: 30UXT...)">
            <button class="btn-ctrl" onclick="rechercherMGRS()">Chercher</button>
        </div>

        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
            <button class="btn-ctrl" onclick="centrerSurGPS()">Centrer GPS</button>
            <button class="btn-ctrl" onclick="basculerModeNuit()" style="background: #444;">🌙 Mode Nuit</button>
            <button class="btn-ctrl" onclick="effacerPoints()" style="background: #d73a49;">Effacer Tracé</button>
            <button class="btn-ctrl" onclick="voirFavoris()" style="background: #d29922;">⭐ Favoris (<span id="fav-count">0</span>)</button>
        </div>

        <div style="font-size: 10px; opacity: 0.8;">
            💡 <i>Cliquez sur la carte pour poser des jalons, calculer les caps et enregistrer vos favoris.</i>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MGRS JS -->
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>

    <script>
        let map = null;
        let userMarker = null;
        let circle = null;
        let searchMarker = null;
        let cheminementPoints = [];
        let polylineRoute = null;
        let favorisMarkers = [];
        let isNightMode = false;
        let favoris = JSON.parse(localStorage.getItem('tactical_favs')) || [];

        function calculerCaps(lat1, lon1, lat2, lon2) {
            const toRad = (deg) => (deg * Math.PI) / 180;
            const toDeg = (rad) => (rad * 180) / Math.PI;
            const dLon = toRad(lon2 - lon1);
            const phi1 = toRad(lat1);
            const phi2 = toRad(lat2);
            const y = Math.sin(dLon) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
            let brng = toDeg(Math.atan2(y, x));
            let azimutDeg = Math.round((brng + 360) % 360);
            let azimutMil = Math.round((azimutDeg * 6400) / 360);
            if (azimutMil >= 6400) azimutMil = 0;
            return { deg: azimutDeg, mil: azimutMil };
        }

        function calculerDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        async function getAltitude(lat, lng) {
            try {
                const response = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lng}`);
                const data = await response.json();
                if (data && data.results && data.results.length > 0) return data.results[0].elevation;
            } catch (e) {}
            return 0;
        }

        function initialiserCarte() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                let mgrsCoord = "Hors zone MGRS";
                try {
                    mgrsCoord = mgrs.forward([lng, lat], 5);
                } catch (e) {
                    mgrsCoord = `Lat:${lat.toFixed(4)} Lon:${lng.toFixed(4)}`;
                }

                if (!map) {
                    const plan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OSM' });
                    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' });

                    map = L.map('map', { layers: [plan] }).setView([lat, lng], 17);
                    L.control.layers({ "Plan": plan, "Satellite": satellite }).addTo(map);

                    map.on('click', async function(e) {
                        const clickLat = e.latlng.lat;
                        const clickLng = e.latlng.lng;
                        let clickMgrs = "";
                        try { clickMgrs = mgrs.forward([clickLng, clickLat], 5); } catch (err) { clickMgrs = "N/A"; }

                        document.getElementById('status').innerHTML = `⏳ <i>Calcul...</i>`;
                        const alt = await getAltitude(clickLat, clickLng);
                        
                        let infoSupp = "";
                        if (cheminementPoints.length > 0) {
                            const d = cheminementPoints[cheminementPoints.length - 1];
                            const dist = calculerDistance(d.lat, d.lng, clickLat, clickLng);
                            const cap = calculerCaps(d.lat, d.lng, clickLat, clickLng);
                            infoSupp = `<br>📏 Dist: ${dist}m<br>🎯 Cap: <b>${cap.mil} ‰</b> (${cap.deg}°)`;
                        }

                        const pointIndex = cheminementPoints.length + 1;
                        const marker = L.marker([clickLat, clickLng]).addTo(map);
                        
                        // Popup avec option de sauvegarde en favori
                        marker.bindPopup(`<b>Jalon #${pointIndex}</b><br>MGRS: ${clickMgrs}<br>Alt: ${alt}m${infoSupp}<br><button class="btn-action" onclick="sauvegarderFavori(${clickLat}, ${clickLng}, '${clickMgrs}')">⭐ Sauvegarder en Favori</button>`).openPopup();
                        
                        cheminementPoints.push({ lat: clickLat, lng: clickLng, marker: marker, mgrs: clickMgrs });
                        mettreAJourItineraire();
                        document.getElementById('status').innerHTML = `📍 <b>Jalon #${pointIndex} Ajouté</b>`;
                    });
                }

                if (userMarker) { map.removeLayer(userMarker); map.removeLayer(circle); }
                userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Votre Position</b><br>MGRS: ${mgrsCoord}`).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: '#0f0', fillColor: '#0f0', fillOpacity: 0.15 }).addTo(map);
                
                document.getElementById('status').innerHTML = `📍 <b>GPS OK</b> (~${Math.round(accuracy)}m)`;
                
                afficherFavorisSurCarte();
                mettreAJourAffichageFavoris();

            }, error => { document.getElementById('status').innerHTML = `⚠️ <b>Erreur GPS</b>`; }, { enableHighAccuracy: true });
        }

        function afficherFavorisSurCarte() {
            favorisMarkers.forEach(m => map.removeLayer(m));
            favorisMarkers = [];

            favoris.forEach((f, index) => {
                const favMarker = L.marker([f.lat, f.lng], {
                    title: `Favori: ${f.mgrs}`
                }).addTo(map);

                favMarker.bindPopup(`<b>⭐ Favori #${index + 1}</b><br>MGRS: ${f.mgrs}<br>Ajouté le: ${f.date || 'N/A'}<br><button class="btn-action" style="background:#d73a49;" onclick="supprimerFavori(${index})">🗑️ Supprimer</button>`);
                
                favorisMarkers.push(favMarker);
            });
        }

        function mettreAJourItineraire() {
            const latLngs = cheminementPoints.map(p => [p.lat, p.lng]);
            if (polylineRoute) map.removeLayer(polylineRoute);
            if (latLngs.length > 1) {
                polylineRoute = L.polyline(latLngs, { color: '#0055ff', weight: 4, opacity: 0.8 }).addTo(map);
            }
        }

        function effacerPoints() {
            cheminementPoints.forEach(p => map.removeLayer(p.marker));
            cheminementPoints = [];
            if (polylineRoute) map.removeLayer(polylineRoute);
            document.getElementById('status').innerHTML = `🗑️ Tracé effacé.`;
        }

        function sauvegarderFavori(lat, lng, mgrsText) {
            const existe = favoris.some(f => f.lat === lat && f.lng === lng);
            if (existe) {
                alert("Ce point est déjà dans vos favoris !");
                return;
            }

            favoris.push({ lat, lng, mgrs: mgrsText, date: new Date().toLocaleDateString() });
            localStorage.setItem('tactical_favs', JSON.stringify(favoris));
            
            afficherFavorisSurCarte();
            mettreAJourAffichageFavoris();
            alert(`⭐ Point sauvegardé dans les favoris !`);
        }

        function supprimerFavori(index) {
            favoris.splice(index, 1);
            localStorage.setItem('tactical_favs', JSON.stringify(favoris));
            afficherFavorisSurCarte();
            mettreAJourAffichageFavoris();
            map.closePopup();
            alert("Favori supprimé.");
        }

        function mettreAJourAffichageFavoris() { 
            document.getElementById('fav-count').innerText = favoris.length; 
        }

        function voirFavoris() {
            if (favoris.length === 0) { 
                alert("Aucun favori enregistré pour le moment."); 
                return; 
            }
            let t = "Vos Favoris:\n";
            favoris.forEach((f, i) => t += `${i + 1}. ${f.mgrs}\n`);
            const choix = prompt(t + "\nEntrez le numéro du favori à centrer :");
            if (choix) {
                const index = parseInt(choix) - 1;
                if (favoris[index] && favorisMarkers[index]) {
                    const f = favoris[index];
                    map.setView([f.lat, f.lng], 17);
                    favorisMarkers[index].openPopup();
                } else {
                    alert("Numéro invalide.");
                }
            }
        }

        function centrerSurGPS() { 
            navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 17)); 
        }

        function rechercherMGRS() {
            const val = document.getElementById('mgrsSearchInput').value.trim();
            try {
                const latLon = mgrs.inverse(val);
                if (searchMarker) map.removeLayer(searchMarker);
                searchMarker = L.marker([latLon[1], latLon[0]]).addTo(map);
                map.setView([latLon[1], latLon[0]], 17);
                searchMarker.bindPopup(`<b>Trouvé :</b> ${val}`).openPopup();
            } catch (err) { alert("Format MGRS invalide !"); }
        }

        function basculerModeNuit() {
            isNightMode = !isNightMode;
            document.getElementById('body-main').classList.toggle('night-mode', isNightMode);
        }

        window.onload = function() { initialiserCarte(); };
    </script>
</body>
</html>
