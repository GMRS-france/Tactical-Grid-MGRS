<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MGRS Library -->
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        #status-container { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.85); color: #0f0; padding: 12px; border-radius: 8px; border: 1px solid #0f0; max-width: 90%; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #search-container { margin-top: 8px; display: flex; gap: 5px; }
        #search-input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 5px; border-radius: 4px; font-size: 12px; width: 160px; outline: none; text-transform: uppercase; }
        #search-btn { background: #0f0; color: #000; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        #btn-pos { position: absolute; bottom: 30px; right: 20px; z-index: 1000; width: 65px; height: 65px; background: #0f0; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .btn-copy { background: #0f0; color: #000; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="status-container">
        <div id="status">Acquisition GPS...</div>
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Ex: 30TWN123456">
            <button id="search-btn" onclick="rechercherMGRS()">Chercher</button>
        </div>
    </div>
    
    <div id="map"></div>
    <button id="btn-pos" onclick="centrerSurGPS()">🎯</button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let userMarker = null;
        let circle = null;
        
        let pointA = null;
        let pointB = null;
        let markerA = null;
        let markerB = null;
        let lineAB = null;
        let searchMarker = null; // Marqueur spécifique pour la recherche

        function calculerAzimutMilliemes(lat1, lon1, lat2, lon2) {
            const toRad = (deg) => (deg * Math.PI) / 180;
            const toDeg = (rad) => (rad * 180) / Math.PI;

            const dLon = toRad(lon2 - lon1);
            const phi1 = toRad(lat1);
            const phi2 = toRad(lat2);

            const y = Math.sin(dLon) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
            
            let brng = Math.atan2(y, x);
            brng = toDeg(brng);
            let azimutDeg = (brng + 360) % 360;

            let azimutMil = Math.round((azimutDeg * 6400) / 360);
            if (azimutMil >= 6400) azimutMil = 0;
            
            return azimutMil;
        }

        function initialiserCarte() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                let mgrsCoord = "";
                try {
                    mgrsCoord = mgrs.forward([lng, lat], 5);
                } catch (e) {
                    mgrsCoord = `Lat: ${lat.toFixed(5)}, Lon: ${lng.toFixed(5)}`;
                }

                if (!map) {
                    map = L.map('map').setView([lat, lng], 17);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: 'Map data © OpenStreetMap'
                    }).addTo(map);

                    map.on('click', function(e) {
                        const clickLat = e.latlng.lat;
                        const clickLng = e.latlng.lng;
                        let clickMgrs = "";

                        try {
                            clickMgrs = mgrs.forward([clickLng, clickLat], 5);
                        } catch (err) {
                            clickMgrs = `Lat: ${clickLat.toFixed(5)}, Lon: ${clickLng.toFixed(5)}`;
                        }

                        if (!pointA || (pointA && pointB)) {
                            if (markerA) map.removeLayer(markerA);
                            if (markerB) map.removeLayer(markerB);
                            if (lineAB) map.removeLayer(lineAB);
                            
                            pointB = null;
                            pointA = [clickLat, clickLng];

                            markerA = L.marker(pointA).addTo(map)
                                .bindPopup(`<b>Point A (Origine)</b><br>MGRS: ${clickMgrs}<br><button class="btn-copy" onclick="copierTexte('${clickMgrs}')">Copier MGRS</button>`)
                                .openPopup();

                            document.getElementById('status').innerHTML = `📍 <b>Point A défini : ${clickMgrs}</b><br><span style="color:#ff0;">Cliquez pour poser le Point B</span>`;
                        
                        } else {
                            pointB = [clickLat, clickLng];

                            markerB = L.marker(pointB).addTo(map)
                                .bindPopup(`<b>Point B (Cible)</b><br>MGRS: ${clickMgrs}<br><button class="btn-copy" onclick="copierTexte('${clickMgrs}')">Copier MGRS</button>`)
                                .openPopup();

                            const distanceMeters = map.distance(pointA, pointB);
                            let distanceStr = distanceMeters >= 1000 ? 
                                `${(distanceMeters / 1000).toFixed(2)} km` : 
                                `${Math.round(distanceMeters)} m`;

                            const azimutMil = calculerAzimutMilliemes(pointA[0], pointA[1], pointB[0], pointB[1]);

                            lineAB = L.polyline([pointA, pointB], {
                                color: '#ff0',
                                weight: 3,
                                dashArray: '5, 5'
                            }).addTo(map);

                            const tacticalInfo = `<br><b>Distance A-B :</b> ${distanceStr}<br><b>Cap :</b> ${azimutMil} mil`;
                            
                            markerB.setPopupContent(`<b>Point B (Cible)</b><br>${clickMgrs}${tacticalInfo}<br><button class="btn-copy" onclick="copierTexte('${clickMgrs}')">Copier MGRS</button>`);
                            markerB.openPopup();

                            document.getElementById('status').innerHTML = `🎯 <b>A ➔ B : ${distanceStr} | Cap : ${azimutMil} mil</b>`;
                        }
                    });
                }

                if (userMarker) {
                    map.removeLayer(userMarker);
                    map.removeLayer(circle);
                }

                userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Votre Position GPS</b><br>MGRS: ${mgrsCoord}`).openPopup();
                circle = L.circle([lat, lng], { radius: accuracy, color: '#0f0', fillColor: '#0f0', fillOpacity: 0.15 }).addTo(map);

            }, error => {
                alert("Erreur GPS : Activez la localisation.");
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }

        // Fonction pour rechercher un code MGRS sur la carte
        function rechercherMGRS() {
            const inputVal = document.getElementById('search-input').value.trim();
            if (!inputVal) {
                alert("Veuillez entrer un code MGRS.");
                return;
            }

            try {
                // Conversion du code MGRS en coordonnées [longitude, latitude]
                const latLon = mgrs.inverse(inputVal);
                const lng = latLon[0];
                const lat = latLon[1];

                // Centrer la carte sur la position trouvée
                map.setView([lat, lng], 17);

                if (searchMarker) {
                    map.removeLayer(searchMarker);
                }

                // Ajouter un marqueur distinct pour l'objectif recherché
                searchMarker = L.marker([lat, lng]).addTo(map)
                    .bindPopup(`<b>Objectif Recherché</b><br>MGRS: ${inputVal.toUpperCase()}<br><button class="btn-copy" onclick="copierTexte('${inputVal.toUpperCase()}')">Copier MGRS</button>`)
                    .openPopup();

                document.getElementById('status').innerHTML = `🔍 <b>Trouvé : ${inputVal.toUpperCase()}</b>`;

            } catch (err) {
                alert("Code MGRS invalide ou mal formaté !");
            }
        }

        function centrerSurGPS() {
            navigator.geolocation.getCurrentPosition(pos => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 17);
            });
        }

        function copierTexte(texte) {
            navigator.clipboard.writeText(texte).then(() => {
                alert("Coordonnées copiées : " + texte);
            }).catch(() => {
                alert("Erreur lors de la copie");
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW err:', err));
            });
        }

        window.onload = initialiserCarte;
    </script>
</body>
</html>
