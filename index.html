<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Grid MGRS France</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MGRS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mgrs/1.0.0/mgrs.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        #status-container { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.85); color: #0f0; padding: 12px; border-radius: 5px; border: 1px solid #0f0; max-width: 90%; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        #btn-pos { position: absolute; bottom: 30px; right: 20px; z-index: 1000; width: 60px; height: 60px; background: #0f0; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="status-container"><div id="status">Calcul de la grille MGRS...</div></div>
    <div id="map"></div>
    <button id="btn-pos" onclick="maPosition()">🎯</button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([46.5, 2.5], 6);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: 'Map data © OpenStreetMap'
        }).addTo(map);

        let marker, circle;

        function onPositionSuccess(position) {
            const { latitude, longitude, accuracy } = position.coords;
            let mgrsCoord = "";
            
            try {
                // Test de conversion standard MGRS (longitude d'abord, puis latitude)
                mgrsCoord = mgrs.forward([longitude, latitude]);
            } catch (e) {
                console.error("Erreur MGRS library:", e);
                // Fallback si la librairie échoue : affichage propre des coordonnées GPS en attendant
                mgrsCoord = `Lat: ${latitude.toFixed(5)}, Lon: ${longitude.toFixed(5)}`;
            }
            
            if (marker) { map.removeLayer(marker); map.removeLayer(circle); }
            
            marker = L.marker([latitude, longitude]).addTo(map).bindPopup("<b>Position</b><br>" + mgrsCoord).openPopup();
            circle = L.circle([latitude, longitude], { 
                radius: accuracy, 
                color: '#0f0', 
                fillColor: '#0f0', 
                fillOpacity: 0.15 
            }).addTo(map);
            
            map.setView([latitude, longitude], 17);
            
            document.getElementById('status').innerHTML = `📍 <b>${mgrsCoord}</b><br><span style="font-size:12px;color:#ccc;">Précision : ±${Math.round(accuracy)}m</span>`;
        }

        function onPositionError(error) {
            document.getElementById('status').innerHTML = `<span style="color:#ff5555;">Erreur GPS : Activez la géolocalisation.</span>`;
        }

        function maPosition() {
            document.getElementById('status').innerText = "Recherche satellite...";
            if (!navigator.geolocation) {
                alert("Non supporté.");
                return;
            }
            navigator.geolocation.getCurrentPosition(onPositionSuccess, onPositionError, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            });
        }

        window.onload = function() {
            maPosition();
        };
    </script>
</body>
</html>
